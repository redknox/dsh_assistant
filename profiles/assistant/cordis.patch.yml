# Governed TARS-NG assistant Profile. Disables DSH base rows this product
# does not mount; product replacement seams live in the dsh-assistant bundle.
- id: timer
  disabled: true
- id: hmr
  disabled: true
- id: typert
  disabled: true
- id: typert-loader
  disabled: true
- id: typert-gateway
  disabled: true
- id: user-questions
- id: llm-retry
  disabled: true
- id: settings
  disabled: true
- id: credentials
  disabled: true
- id: llm-pi-ai
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: subprocess
  disabled: true
- id: sandbox
  disabled: true
- id: sandbox-policy
  disabled: true
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: approval
  disabled: true
- id: permission
  disabled: true
- id: shell-env
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  config:
    waitTimeoutMs: 30000
    maxWaitTimeoutMs: 120000
    completionDelivery: quiet
    maxConsecutiveWakes: 1
- id: fs-observation-policy
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  config:
    includeDefaultRoots: false
    watchFollowSymlinks: false
- id: skill-badge
  disabled: true
- id: commands
- id: command-feedback
  disabled: true
- id: goal
  config:
    defaultMaxGoalRounds: 8
- id: goal-round-driver
- id: command-goal
  disabled: true
- id: plan-mode
  config:
    section: "Plan Mode is read-only exploration. Inspect current state, maintain todo_write, and present the complete plan through exit_plan_mode. Do not claim that changes were executed. TARS-NG enforces this restriction at tool dispatch."
- id: command-compact
- id: subagent
  config: {}
- id: subagent-spawn-in-process
  config:
    providerName: tars-spawn
- id: subagent-fork-in-process
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: workflow-worker-thread
  config:
    provider: tars-governed
    maxConcurrentAgents: 2
    maxTotalAgents: 4
    maxItemsPerCall: 4
    syncTimeoutMs: 1000
    disposeGraceMs: 5000
- id: tool-workflow
  disabled: true
- id: timeout-policy
  config: {}
- id: tool-todo
  config:
    allowParallelInProgress: false
- id: tool-goal
  config:
    blockedAfterConsecutiveRounds: 3
- id: tool-ralph
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: repeat-tool-reminder
  disabled: true
- id: web
  config:
    searchProvider: deepseek
- id: web-search-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    maxTokens: 2048
    maxUses: 2
- id: tool-web
  config:
    search: true
    fetch: false
    searchMaxResults: 6
    searchMaxQueries: 2
    searchTimeoutMs: 30000
- id: fs-sandbox
  disabled: true
